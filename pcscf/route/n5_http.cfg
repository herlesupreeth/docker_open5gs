#!ifdef WITH_N5
# TS 29.500 5.2.3.3.2 refers to RFC 9110 5.6.7 for the date fields.
# UTC seconds and microseconds use the same message-time snapshot, avoiding
# a mismatched fraction at a second boundary. Always emit three digits and GMT.
route[N5_HTTP_HEADERS] {
    $var(n5_http_budget) = N5_SBI_TIMEOUT_MS;
    $var(n5_http_ms) = $TV(u) / 1000;
    $var(n5_http_ms_text) = $_s($var(n5_http_ms));
    if ($var(n5_http_ms) < 10) { $var(n5_http_ms_text) = "00" + $var(n5_http_ms_text); }
    else if ($var(n5_http_ms) < 100) { $var(n5_http_ms_text) = "0" + $var(n5_http_ms_text); }
    $var(n5_http_timestamp) = $_s($utimef(%a, %d %b %Y %H:%M:%S))
        + "." + $var(n5_http_ms_text) + " GMT";
    # TS 29.500 6.11.2.2: advertise the same budget used by http_client.
    $var(n5_http_headers) = "accept: application/json, application/problem+json\r\n"
        + "3gpp-sbi-discovery-target-nf-type: " + $var(n5_http_target_nf) + "\r\n"
        + "3gpp-sbi-discovery-service-names: " + $var(n5_http_service) + "\r\n"
        + "3gpp-sbi-max-rsp-time: " + $_s($var(n5_http_budget)) + "\r\n"
        + "3gpp-sbi-sender-timestamp: " + $var(n5_http_timestamp);
}

# TS 29.500 6.10.2.5 and 6.12.2: subsequent requests through SCP retain
# the resource owner's apiRoot and any binding supplied in a service response.
# n5_http_key identifies an AppSession (pa|ID) or NRF registration (nrf|ID).
# A missing header on a later response does not erase earlier routing metadata.
route[N5_HTTP_RESOURCE_SAVE] {
    $var(n5_http_location) = "";
    if ($httprhdr(location) != $null) {
        $var(n5_http_location) = $(httprhdr(location){s.trim});
    }
    if ($var(n5_http_location) =~ "^https?://[^[:space:]?#]+/(npcf-policyauthorization|nnrf-nfm)/v[0-9]+/[^[:space:]?#]+$") {
        # Preserve an optional deployment prefix before the API service name.
        $var(n5_http_apiroot) = $(var(n5_http_location){re.subst,!/(npcf-policyauthorization|nnrf-nfm)/v[0-9]+/.*$!!});
        $sht(n5_http_resources=>$var(n5_http_key)::apiroot) = $var(n5_http_apiroot);
    } else if (!strempty($var(n5_http_location))) {
        xwarn("N5 HTTP resource-location-unusable resource=$var(n5_http_key); retaining previous routing metadata\n");
    }
    $var(n5_http_binding) = "";
    if ($httprhdr(3gpp-sbi-binding) != $null) {
        $var(n5_http_binding) = $(httprhdr(3gpp-sbi-binding){s.trim});
    }
    if (!strempty($var(n5_http_binding))) {
        if ($var(n5_http_binding) =~ "[\r\n]") {
            xwarn("N5 HTTP binding-invalid resource=$var(n5_http_key); retaining previous binding\n");
        } else {
            $sht(n5_http_resources=>$var(n5_http_key)::binding) = $var(n5_http_binding);
        }
    }
}

route[N5_HTTP_RESOURCE_HEADERS] {
    if ($sht(n5_http_resources=>$var(n5_http_key)::apiroot) != $null) {
        $var(n5_http_headers) = $var(n5_http_headers) + "\r\n3gpp-sbi-target-apiroot: "
            + $sht(n5_http_resources=>$var(n5_http_key)::apiroot);
    }
    # A new subscription may use the selected NRF's apiRoot, but its binding
    # belongs to the NF-registration resource and must not be copied to it.
    if ($var(n5_http_existing_resource) == 1
            && $sht(n5_http_resources=>$var(n5_http_key)::binding) != $null) {
        $var(n5_http_headers) = $var(n5_http_headers) + "\r\n3gpp-sbi-routing-binding: "
            + $sht(n5_http_resources=>$var(n5_http_key)::binding);
    }
}

route[N5_HTTP_RESOURCE_FORGET] {
    $sht(n5_http_resources=>$var(n5_http_key)::apiroot) = $null;
    $sht(n5_http_resources=>$var(n5_http_key)::binding) = $null;
}
#!endif
