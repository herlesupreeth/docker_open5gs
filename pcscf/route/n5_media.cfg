# N5_HTTP_HEADER_FIX_V1
#!ifdef WITH_N5
# 3GPP TS 24.229 4.1/Annex A refers to RFC 3261 12 for dialog identity.
# Context keys are local implementation choices. TS 29.514 B.3.1 requires
# originating fork branches to update the existing AF session, not create one each.
route[N5_MEDIA_KEY] {
    if (strempty($ci) || strempty($ft)) { return(-1); }
    $var(n5_upstream) = 0;
    if (isflagset(FLT_N5_UPSTREAM)) { $var(n5_upstream) = 1; }
    $var(n5_from_tag) = $ft;
    # TS 24.229 Annex A refers to RFC 3261 section 12: early dialogs
    # have a real To tag. Kamailio $var cannot hold null (it becomes integer 0).
    # Keep an absent tag empty, so independent initial MT branches cannot alias.
    $var(n5_to_tag) = "";
    if (!strempty($tt)) { $var(n5_to_tag) = $tt; }
    if ($var(n5_upstream) == 1) {
        $var(n5_from_tag) = $tt;
        $var(n5_to_tag) = $ft;
    }
    $var(n5_base) = $var(n5_leg) + "|" + $ci + "|" + $var(n5_from_tag);
    $var(n5_key) = $var(n5_base);
    $var(n5_alias) = $var(n5_base) + "|" + $var(n5_to_tag);
    if ($var(n5_leg) == "MT") {
        if (!strempty($var(n5_to_tag))
                && $sht(n5_media_state=>$var(n5_alias)::context) != $null) {
            $var(n5_key) = $sht(n5_media_state=>$var(n5_alias)::context);
        } else {
            if ($avp(n5_local_ue) == $null || strempty($avp(n5_local_ue))) { return(-1); }
            $var(n5_key) = $var(n5_base) + "|" + $avp(n5_local_ue);
            if (!strempty($var(n5_to_tag))) { $sht(n5_media_state=>$var(n5_alias)::context) = $var(n5_key); }
        }
    }
    $var(n5_branch) = $var(n5_key) + "|" + $var(n5_to_tag);
    return(1);
}

route[N5_MEDIA_START] {
    $avp(n5_initial) = 1;
    $avp(n5_leg) = $var(n5_leg);
    if ($var(n5_leg) == "MO") {
        $avp(n5_local_ue) = $si;
        $avp(n5_gpsi) = $(fU{re.subst,/^[+]//});
    } else {
        $avp(n5_local_ue) = $dd;
        $avp(n5_gpsi) = $(tU{re.subst,/^[+]//});
    }
    if (!route(N5_MEDIA_KEY)) { return; }
    sht_lock("n5_media_dialogs=>$var(n5_key)");
    $sht(n5_media_state=>$var(n5_key)::ue) = $avp(n5_local_ue);
    $sht(n5_media_state=>$var(n5_key)::gpsi) = $avp(n5_gpsi);
    $sht(n5_media_state=>$var(n5_key)::call-id) = $ci;
    $sht(n5_media_state=>$var(n5_key)::from-tag) = $var(n5_from_tag);
    # Local guard exceeds fr_inv_timer, covering an unobserved final failure.
    $sht(n5_media_gc=>$var(n5_key)) = "setup-timeout";
    $shtex(n5_media_gc=>$var(n5_key)) = 180;
    sht_unlock("n5_media_dialogs=>$var(n5_key)");
}

route[N5_MEDIA_HEADERS] {
    $var(n5_http_target_nf) = "PCF";
    $var(n5_http_service) = "npcf-policyauthorization";
    route(N5_HTTP_HEADERS);
    $var(n5_headers) = $var(n5_http_headers);
}

# TS 29.514 4.2.2/4.2.3.2, B.1/B.3: provision completed media information.
# Caller holds the context lock across state selection and the HTTP operation.
route[N5_MEDIA_PUBLISH] {
#!ifdef WITH_N5_SPLIT_RTP_RTCP
    $var(n5_rtp_profile) = "split";
#!else
    $var(n5_rtp_profile) = "combined";
#!endif
    $var(n5_authorized) = 0;
    $var(n5_reason) = $var(n5_event);
	$var(n5_new_context) = 0;
	$var(n5_app_session) = "";
	if ($sht(n5_media_dialogs=>$var(n5_key)) != $null) {
		$var(n5_app_session) = $sht(n5_media_dialogs=>$var(n5_key));
	}
	if ($var(n5_app_session) =~ "^closed(:|$)") {
        xnotice("N5 media ignored-after-release context=$var(n5_key) event=$var(n5_event)\n");
        return;
	}

    $var(n5_authorized) = 0;
    $var(n5_body) = '{}';
    jansson_set("obj", "ascReqData.medComponents", "$var(n5_components)", "$var(n5_body)");
    route(N5_MEDIA_HEADERS);
	if ($var(n5_app_session) != "") {
		jansson_set("str", "ascReqData.sipForkInd", "$var(n5_fork)", "$var(n5_body)");
        $var(n5_http_key) = "pa|" + $var(n5_app_session);
        $var(n5_http_existing_resource) = 1;
        route(N5_HTTP_RESOURCE_HEADERS);
        $var(n5_headers) = $var(n5_http_headers);
		# Update negotiated media without changing the subscriber identity.
		$var(n5_headers) = "Content-Type: application/merge-patch+json\r\n" + $var(n5_headers);
		http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(n5_app_session)", "$var(n5_body)", "$var(n5_headers)", "$var(n5_result)");
		$var(n5_http_status) = $rc;
		if ($var(n5_http_status) == 200 || $var(n5_http_status) == 204) {
            $var(n5_http_key) = "pa|" + $var(n5_app_session);
            route(N5_HTTP_RESOURCE_SAVE);
			$sht(n5_media_dialogs=>$var(n5_key)) = $var(n5_app_session);
			$var(n5_authorized) = 1;
			xlog("L_INFO", "N5 media PATCH profile=$var(n5_rtp_profile) context=$var(n5_key) appSession=$var(n5_app_session) dialog=$var(n5_to_tag) fork=$var(n5_fork) event=$var(n5_event) method=$rm cseq=$cs\n");
		}
    } else {
        $var(n5_new_context) = 1;
        $var(ue_ip) = $sht(n5_media_state=>$var(n5_key)::ue);
        $var(n5_gpsi) = "msisdn-" + $sht(n5_media_state=>$var(n5_key)::gpsi);
        jansson_set("str", "ascReqData.ueIpv4", "$var(ue_ip)", "$var(n5_body)");
        jansson_set("str", "ascReqData.gpsi", "$var(n5_gpsi)", "$var(n5_body)");
        jansson_set("str", "ascReqData.dnn", "ims", "$var(n5_body)");
        jansson_set("str", "ascReqData.afAppId", "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"", "$var(n5_body)");
        # TS 29.514 5.8 Table 5.8-1: IMS_SBI is feature 5 (hex 10).
        jansson_set("str", "ascReqData.suppFeat", "10", "$var(n5_body)");
        jansson_set("str", "ascReqData.notifUri", "http://N5_BIND_IP:N5_BIND_PORT", "$var(n5_body)");
        jansson_set("obj", "ascReqData.evSubsc", '{"events":[{"event":"QOS_NOTIF","notifMethod":"PERIODIC"},{"event":"ANI_REPORT","notifMethod":"ONE_TIME"}]}', "$var(n5_body)");
        $var(n5_headers) = "Content-Type: application/json\r\n" + $var(n5_headers);
		http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions", "$var(n5_body)", "$var(n5_headers)", "$var(n5_result)");
		$var(n5_http_status) = $rc;
		if ($var(n5_http_status) == 201 && !strempty($httprhdr(location))) {
			$var(n5_location) = $httprhdr(location);
			$var(n5_app_session) = $(var(n5_location){s.trim}{s.select,-1,/});
			if ($var(n5_app_session) =~ "^[A-Za-z0-9._~-]+$") {
                $var(n5_http_key) = "pa|" + $var(n5_app_session);
                route(N5_HTTP_RESOURCE_SAVE);
				$sht(n5_media_dialogs=>$var(n5_key)) = $var(n5_app_session);
                $var(n5_supported) = "0";
                jansson_get("ascRespData.suppFeat", "$var(n5_result)", "$var(n5_supported)");
                $sht(n5_media_state=>$var(n5_key)::features) = $var(n5_supported);
				$var(n5_authorized) = 1;
				xlog("L_INFO", "N5 media POST profile=$var(n5_rtp_profile) context=$var(n5_key) appSession=$var(n5_app_session) ue=$var(ue_ip) dialog=$var(n5_to_tag) fork=$var(n5_fork) event=$var(n5_event) method=$rm cseq=$cs status=$var(n5_http_status) reason=$var(n5_reason)\n");
			}
		}
	}
    if ($var(n5_authorized) == 0) {
		xlog("L_ERR", "N5 media authorization-failed profile=$var(n5_rtp_profile) context=$var(n5_key) appSession=$var(n5_app_session) status=$var(n5_http_status) result=$var(n5_result) reason=$var(n5_reason)\n");
        if ($var(n5_new_context) == 1) { $var(n5_reject_initial) = 1; }
    }
}

# Preserve fail-closed setup behavior; failed modification retains prior policy.
# This is executed after releasing the context lock, not while holding it.
route[N5_MEDIA_REJECT_INITIAL] {
    if ($var(n5_reject_initial) != 1) { return; }
    $var(n5_reason) = "initial-authorization-failed";
    route(N5_MEDIA_END);
    if (dlg_get("$ci", "$var(n5_from_tag)", "$var(n5_to_tag)")) {
        dlg_terminate("all", "N5 QoS authorization failed");
    }
}

route[N5_MEDIA_END] {
	if (!route(N5_MEDIA_KEY)) {
		return;
	}
    # Preserve the MT relay selector before releasing the policy context.
    if ($var(n5_leg) == "MT") {
        $avp(n5_rtp_mt_ue) = $sht(n5_media_state=>$var(n5_key)::ue);
    }
    if ($sht(n5_media_state=>$var(n5_key)::winner) != $null
        && !strempty($var(n5_to_tag))
        && $sht(n5_media_state=>$var(n5_key)::winner) != $var(n5_to_tag)) {
        xnotice("N5 media release-skipped context=$var(n5_key) dialog=$var(n5_to_tag) selected=$sht(n5_media_state=>$var(n5_key)::winner); selected authorization retained\n");
        return;
    }
    if (!sht_lock("n5_media_dialogs=>$var(n5_key)")) {
		return;
	}
    route(N5_MEDIA_DELETE_LOCKED);
    sht_unlock("n5_media_dialogs=>$var(n5_key)");
}

# TS 29.514 4.2.4.2 permits HTTP 200 or 204. A 404 is local already-absent handling.
route[N5_MEDIA_DELETE_LOCKED] {
	$var(n5_app_session) = "";
	if ($sht(n5_media_dialogs=>$var(n5_key)) != $null) {
		$var(n5_app_session) = $sht(n5_media_dialogs=>$var(n5_key));
	}
	if ($var(n5_app_session) == "closed") {
        return;
    }
    if ($var(n5_app_session) =~ "^closed:") {
		$var(n5_app_session) = $(var(n5_app_session){s.select,1,:});
	}

	$var(n5_closed) = 1;
	if ($var(n5_app_session) != "") {
		route(N5_MEDIA_HEADERS);
        $var(n5_http_key) = "pa|" + $var(n5_app_session);
        $var(n5_http_existing_resource) = 1;
        route(N5_HTTP_RESOURCE_HEADERS);
        $var(n5_headers) = $var(n5_http_headers);
		$var(n5_headers) = "X-SIP-Status: " + $var(n5_reason) + "\r\n" + $var(n5_headers);
		http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(n5_app_session)/delete", "", "$var(n5_headers)", "$var(n5_result)");
		$var(n5_http_status) = $rc;
		if ($var(n5_http_status) != 200 && $var(n5_http_status) != 204 && $var(n5_http_status) != 404) {
			$var(n5_closed) = 0;
			xlog("L_ERR", "N5 media DELETE-failed context=$var(n5_key) appSession=$var(n5_app_session) status=$var(n5_http_status) reason=$var(n5_reason)\n");
		} else {
			xlog("L_INFO", "N5 media DELETE context=$var(n5_key) appSession=$var(n5_app_session) status=$var(n5_http_status) reason=$var(n5_reason)\n");
		}
	}
	if ($var(n5_closed) == 1) {
        if (!strempty($var(n5_app_session))) {
            $var(n5_http_key) = "pa|" + $var(n5_app_session);
            route(N5_HTTP_RESOURCE_FORGET);
        }
		# A late media reply must not reopen a terminated dialog.
		$sht(n5_media_dialogs=>$var(n5_key)) = "closed";
        $sht(n5_media_gc=>$var(n5_key)) = "tombstone-expire";
        $shtex(n5_media_gc=>$var(n5_key)) = 180;
        $var(n5_prefix) = $var(n5_key) + "::";
        sht_rm_name("n5_media_state", "sw", "$var(n5_prefix)");
        # sht_rm_value supports re/sw/ew/in, not equality. Compare the full
        # context value explicitly; prefixes/regex metacharacters can alias calls.
        sht_iterator_start("n5_alias_gc", "n5_media_state");
        while (sht_iterator_next("n5_alias_gc")) {
            # State includes numeric CSeq/flags. Format as text before comparison;
            # otherwise an integer value makes Kamailio parse the context as int.
            if ($_s($shtitval(n5_alias_gc)) == $var(n5_key)) {
                sht_iterator_rm("n5_alias_gc");
            }
        }
        sht_iterator_end("n5_alias_gc");
        $var(n5_prefix) = $var(n5_key) + "|";
        sht_rm_name("n5_media_state", "sw", "$var(n5_prefix)");
	} else {
		# Retain the exact ID for a retry on the BYE reply or retransmission.
        $sht(n5_media_dialogs=>$var(n5_key)) = "closed:" + $var(n5_app_session);
        $sht(n5_media_gc=>$var(n5_key)) = "delete-retry";
        $shtex(n5_media_gc=>$var(n5_key)) = 10;
	}
}

# Local retry timer; SIP retransmissions are not required to complete cleanup.
event_route[htable:expired:n5_media_gc] {
    $var(n5_key) = $shtrecord(key);
    $var(n5_reason) = $shtrecord(value);
    sht_lock("n5_media_dialogs=>$var(n5_key)");
    if ($var(n5_reason) == "tombstone-expire") {
        if ($sht(n5_media_dialogs=>$var(n5_key)) == "closed") { $sht(n5_media_dialogs=>$var(n5_key)) = $null; }
        sht_unlock("n5_media_dialogs=>$var(n5_key)");
        return;
    }
    if ($var(n5_reason) == "dialog-watch" || $var(n5_reason) == "dialog-watch-confirm") {
        $var(n5_watch_ci) = $sht(n5_media_state=>$var(n5_key)::call-id);
        $var(n5_watch_ft) = $sht(n5_media_state=>$var(n5_key)::from-tag);
        $var(n5_watch_tt) = $sht(n5_media_state=>$var(n5_key)::winner);
        if (dlg_get("$var(n5_watch_ci)", "$var(n5_watch_ft)", "$var(n5_watch_tt)")) {
            $sht(n5_media_gc=>$var(n5_key)) = "dialog-watch";
            $shtex(n5_media_gc=>$var(n5_key)) = 60;
            sht_unlock("n5_media_dialogs=>$var(n5_key)");
            return;
        }
        if ($var(n5_reason) == "dialog-watch") {
            $sht(n5_media_gc=>$var(n5_key)) = "dialog-watch-confirm";
            $shtex(n5_media_gc=>$var(n5_key)) = 60;
            sht_unlock("n5_media_dialogs=>$var(n5_key)");
            return;
        }
    }
    route(N5_MEDIA_DELETE_LOCKED);
    sht_unlock("n5_media_dialogs=>$var(n5_key)");
}
#!endif
