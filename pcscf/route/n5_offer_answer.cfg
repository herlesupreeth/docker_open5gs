#!ifdef WITH_N5
# 3GPP TS 29.514 V18.12.0 B.1: provision service information for SDP answers.
# TS 24.229 V18.10.0 Annex A Table A.4 items 14/17 refer to RFC 3262/3311.
# Pending offers and completed negotiations are distinct from AF session state.
route[N5_OA_RX_SDP] {
    # TS 29.514 B.1/B.2.1 refers to TS 29.513 7.3.3 for flow derivation.
    # Save UE-facing input before RTPengine replaces its connection/ports.
    $var(n5_rx_sdp) = "";
    if (sdp_content()) { $var(n5_rx_sdp) = $sdp(body); }
    # Reset per-message views: script variables otherwise survive worker reuse.
    # RTPengine's write_sdp_pv replaces only n5_tx_sdp after successful rewrite.
    $var(n5_tx_sdp) = $var(n5_rx_sdp);
    if (is_request()) { $avp(n5_rx_request_sdp) = $var(n5_rx_sdp); }
}

route[N5_OA_TX_SDP] {
    # Transaction AVPs preserve both views across workers and reply callbacks.
    # Local UE endpoints come from ingress; its remote destinations come from
    # the SDP actually relayed towards that UE after media anchoring.
    $avp(n5_tx_request_sdp) = "";
    if ($var(n5_tx_sdp) =~ "^v=0") { $avp(n5_tx_request_sdp) = $var(n5_tx_sdp); }
}

# TS 24.229 Annex A Table A.4 refers to RFC 3261/3262 for offers in
# responses and their ACK/PRACK answers. RTPengine must receive the same role.
route[N5_RTP_DELAYED] {
    $var(n5_rtp_handled) = 0;
    if (!sdp_content()) { return; }
    if (isflagset(FLT_MOBILE_ORIG)) { $var(n5_leg) = "MO"; }
    else { $var(n5_leg) = "MT"; }
    if (is_reply() && is_method("INVITE") && t_check_status("^[12][0-9][0-9]$")) {
        $var(n5_rtp_req_sdp) = $avp(n5_rx_request_sdp);
        if (!($var(n5_rtp_req_sdp) =~ "^v=0")) {
            $var(n5_rtp_flags) = $var(n5_rtp_offer_flags) + " " + $var(rtpe_leg_flags);
            if (isflagset(FLT_MOBILE_ORIG)) {
                set_dlg_profile("caller", "$fU");
            } else { set_dlg_profile("callee", "$tU"); }
            $var(n5_rtpe_op) = "offer";
            $var(n5_rtpe_flags) = $var(n5_rtp_flags);
            route(N5_RTP_RUN);
            if ($var(n5_rtpe_success) == 0) {
                xlog("L_ERR", "RTP delayed-offer failed leg=$var(n5_leg) call=$ci method=$rm cseq=$cs\n");
            }
            $var(n5_rtp_handled) = 1;
            xnotice("RTP response-offer leg=$var(n5_leg) call=$ci status=$rs cseq=$cs\n");
        }
    } else if (is_request() && is_method("ACK|PRACK")) {
        if (!route(N5_MEDIA_KEY)) { return; }
        $var(n5_rtp_pending) = $sht(n5_media_state=>$var(n5_branch)::response-offer);
        if ($var(n5_rtp_pending) =~ "^v=0") {
            $var(n5_rtpe_op) = "answer";
            $var(n5_rtpe_flags) = $var(rtpe_leg_flags);
            route(N5_RTP_RUN);
            if ($var(n5_rtpe_success) == 0) {
                xlog("L_ERR", "RTP request-answer failed leg=$var(n5_leg) call=$ci method=$rm cseq=$cs\n");
            }
            $var(n5_rtp_handled) = 1;
            xnotice("RTP request-answer leg=$var(n5_leg) call=$ci method=$rm cseq=$cs\n");
        } else if (is_method("PRACK")) {
            $var(n5_rtpe_op) = "offer";
            $var(n5_rtpe_flags) = $var(rtpe_leg_flags);
            route(N5_RTP_RUN);
            $var(n5_rtp_handled) = 1;
        }
    } else if (is_reply() && is_method("PRACK") && t_check_status("^2[0-9][0-9]$")) {
        $var(n5_rtpe_op) = "answer";
        $var(n5_rtpe_flags) = $var(rtpe_leg_flags);
        route(N5_RTP_RUN);
        $var(n5_rtp_handled) = 1;
    }
}

route[N5_OA_REQUEST] {
	$var(n5_reject_initial) = 0;
	if (!route(N5_MEDIA_KEY)) { return; }
	if (!is_method("ACK|PRACK") || !sdp_content()) { return; }
	sht_lock("n5_media_dialogs=>$var(n5_key)");
	$var(n5_offer_key) = $var(n5_branch) + "::response-offer";
	$var(n5_offer) = $sht(n5_media_state=>$var(n5_offer_key));
	if ($var(n5_offer) != $null) {
        # RFC 3262 7.2: RAck must identify the exact reliable response.
        $var(n5_match) = 0;
        if (is_method("ACK") && $cs == $sht(n5_media_state=>$var(n5_branch)::offer-cseq)) { $var(n5_match) = 1; }
        if (is_method("PRACK")
            && $(hdr(RAck){s.select,0, }) == $sht(n5_media_state=>$var(n5_branch)::offer-rseq)
            && $(hdr(RAck){s.select,1, }) == $sht(n5_media_state=>$var(n5_branch)::offer-cseq)
            && $(hdr(RAck){s.select,2, }) == "INVITE") { $var(n5_match) = 1; }
        if ($var(n5_match) == 0) {
            sht_unlock("n5_media_dialogs=>$var(n5_key)");
            return;
        }
		$var(n5_answer) = $var(n5_tx_sdp);
		$var(n5_offer_local) = 0;
		if (($var(n5_leg) == "MT" && $var(n5_upstream) == 0)
			|| ($var(n5_leg) == "MO" && $var(n5_upstream) == 1)) { $var(n5_offer_local) = 1; }
        if ($var(n5_offer_local) == 0) { $var(n5_answer) = $var(n5_rx_sdp); }
		$var(n5_tx) = $sht(n5_media_state=>$var(n5_branch)::response-tx);
		$var(n5_event) = "request-answer";
		route(N5_OA_COMMIT);
		if ($var(n5_authorized) == 1) { $sht(n5_media_state=>$var(n5_offer_key)) = $null; }
	}
	sht_unlock("n5_media_dialogs=>$var(n5_key)");
    route(N5_MEDIA_REJECT_INITIAL);
}

route[N5_OA_REPLY] {
	$var(n5_reject_initial) = 0;
	if (!route(N5_MEDIA_KEY)) { return; }
	if (!is_method("INVITE|UPDATE|PRACK")) { return; }
	if (t_check_status("^[3-6][0-9][0-9]$")) {
        route(N5_RTP_RESTORE);
		# TS 24.229 4.1/Annex A refers to RFC 3261 14.1. A rejected
		# re-INVITE does not end the established dialog. RFC 6141 3.3/3.4
		# additionally clarifies already-executed changes (supplementary RFC).
        $var(n5_failed_session) = $sht(n5_media_dialogs=>$var(n5_key));
		xnotice("N5 media SIP-failure context=$var(n5_key) dialog=$var(n5_to_tag) appSession=$var(n5_failed_session) method=$rm cseq=$cs status=$rs reason=$rr; policy-retained-until-dialog-release\n");
		return;
	}
	sht_lock("n5_media_dialogs=>$var(n5_key)");
	if (sdp_content() && t_check_status("^(18[0-9]|2[0-9][0-9])$")) {
		$var(n5_offer) = $avp(n5_rx_request_sdp);
		$var(n5_tx) = $rm + "|" + $cs + "|" + $var(n5_upstream);
		if (!($var(n5_offer) =~ "^v=0")) {
            $var(n5_reply_done) = $var(n5_branch) + "|" + $var(n5_tx);
			if (is_method("INVITE") && $sht(n5_media_state=>$var(n5_reply_done)) == $null) {
				$sht(n5_media_state=>$var(n5_branch)::response-offer) = $var(n5_tx_sdp);
                if (($var(n5_leg) == "MT" && $var(n5_upstream) == 0)
                    || ($var(n5_leg) == "MO" && $var(n5_upstream) == 1)) {
                    $sht(n5_media_state=>$var(n5_branch)::response-offer) = $var(n5_rx_sdp);
                }
                $sht(n5_media_state=>$var(n5_branch)::response-tx) = $var(n5_tx);
                $sht(n5_media_state=>$var(n5_branch)::offer-cseq) = $cs;
                $sht(n5_media_state=>$var(n5_branch)::offer-rseq) = $hdr(RSeq);
			}
		} else {
			$var(n5_answer) = $var(n5_tx_sdp);
			$var(n5_offer_local) = 0;
			if (($var(n5_leg) == "MO" && $var(n5_upstream) == 0)
				|| ($var(n5_leg) == "MT" && $var(n5_upstream) == 1)) { $var(n5_offer_local) = 1; }
            if ($var(n5_offer_local) == 0) { $var(n5_offer) = $avp(n5_tx_request_sdp); }
            if ($var(n5_offer_local) == 0) { $var(n5_answer) = $var(n5_rx_sdp); }
			$var(n5_event) = "SDP-answer";
			route(N5_OA_COMMIT);
		}
	}
	# TS 29.514 B.3.2: select the winning dialog's latest negotiated SDP.
	# The final INVITE may repeat SDP older than an intervening UPDATE.
	if ($var(n5_reject_initial) == 0 && $avp(n5_initial) == 1 && is_method("INVITE") && t_check_status("^2[0-9][0-9]$")) {
		if ($sht(n5_media_state=>$var(n5_key)::winner) == $null) {
			$sht(n5_media_state=>$var(n5_key)::winner) = $var(n5_to_tag);
            route(N5_RTP_SELECT_LOCKED);
			$sht(n5_media_gc=>$var(n5_key)) = "dialog-watch";
            $shtex(n5_media_gc=>$var(n5_key)) = 60;
			$var(n5_components) = $sht(n5_media_state=>$var(n5_branch)::components);
			if ($var(n5_components) =~ "^[{]") {
				$var(n5_fork) = "SINGLE_DIALOGUE";
				$var(n5_event) = "selected-dialog";
				route(N5_MEDIA_PUBLISH);
			}
		}
	}
	sht_unlock("n5_media_dialogs=>$var(n5_key)");
    route(N5_MEDIA_REJECT_INITIAL);
}

# Caller holds the AF context lock. Do not commit the same transaction twice.
route[N5_OA_COMMIT] {
	$var(n5_authorized) = 0;
	$var(n5_done_key) = $var(n5_branch) + "|" + $var(n5_tx);
	if ($sht(n5_media_state=>$var(n5_done_key)) != $null) { return; }
	if ($sht(n5_media_state=>$var(n5_key)::winner) != $null
		&& $sht(n5_media_state=>$var(n5_key)::winner) != $var(n5_to_tag)) { return; }
	$var(n5_local_sdp) = $var(n5_offer);
	$var(n5_remote_sdp) = $var(n5_answer);
	if ($var(n5_offer_local) == 0) {
		$var(n5_local_sdp) = $var(n5_answer);
		$var(n5_remote_sdp) = $var(n5_offer);
	}
	if (!route(N5_SDP_COMPONENTS)) {
        if ($sht(n5_media_dialogs=>$var(n5_key)) == $null) {
            $var(n5_reject_initial) = 1;
            xlog("L_ERR", "N5 media unsupported-SDP context=$var(n5_key) method=$rm cseq=$cs; initial authorization cannot be built\n");
        } else {
            xlog("L_ERR", "N5 media unsupported-SDP context=$var(n5_key) method=$rm cseq=$cs; existing-policy-retained\n");
        }
		return;
	}
	$var(n5_fork) = "SINGLE_DIALOGUE";
	if ($sht(n5_media_state=>$var(n5_key)::first-tag) == $null) {
		$sht(n5_media_state=>$var(n5_key)::first-tag) = $var(n5_to_tag);
	} else if ($sht(n5_media_state=>$var(n5_key)::first-tag) != $var(n5_to_tag)
		&& $sht(n5_media_state=>$var(n5_key)::winner) == $null) {
		$sht(n5_media_state=>$var(n5_key)::forked) = 1;
	}
	if ($sht(n5_media_state=>$var(n5_key)::forked) == 1
		&& $sht(n5_media_state=>$var(n5_key)::winner) == $null) { $var(n5_fork) = "SEVERAL_DIALOGUES"; }
    if ($var(n5_fork) == "SEVERAL_DIALOGUES") {
        $var(n5_features) = $sht(n5_media_state=>$var(n5_key)::features);
        if (!($var(n5_features) =~ "[13579bBdDfF][0-9a-fA-F]$")) {
            xlog("L_ERR", "N5 media authorization-failed context=$var(n5_key) reason=PCF-IMS_SBI-not-negotiated; fork policy requires capable PCF\n");
            return;
        }
    }
	$sht(n5_media_state=>$var(n5_branch)::components) = $var(n5_components);
	route(N5_MEDIA_PUBLISH);
	if ($var(n5_authorized) == 1) { $sht(n5_media_state=>$var(n5_done_key)) = 1; }
}
#!endif

#!ifdef WITH_N5
# Transaction failure (including generated timeout), after any SBC failover.
# TS 29.514 4.2.4.2 supplies the N5 termination operation.
route[N5_INITIAL_FAILED] {
    if ($avp(n5_initial) != 1) { return; }
    $var(n5_leg) = $avp(n5_leg);
    if (!route(N5_MEDIA_KEY)) { return; }
    if ($sht(n5_media_state=>$var(n5_key)::winner) != $null) { return; }
    # TS 24.229 Annex A refers to RFC 3261 9.2/16.10: CANCEL itself
    # is not a dialog teardown. Release early media after final INVITE failure,
    # including generated timeout, after SBC failover has been exhausted.
    route(NATMANAGE);
    $var(n5_reason) = "initial-INVITE-failed";
    xnotice("N5 media initial-failure context=$var(n5_key) status=$T_reply_code; releasing early authorization\n");
    route(N5_MEDIA_END);
}
failure_route[N5_initial_failure] { route(N5_INITIAL_FAILED); }
#!endif
