#!ifdef WITH_N5
# TS 24.229 4.1/Annex A refers to RFC 3261 12/14 and RFC 3264 for
# dialog/offer-answer handling. NG identifiers and relay flags are local policy.
# Keep the existing transport conversion flags, but select media by the call
# leg and normalized tags rather than caller/callee numbers shared by calls.
route[N5_RTP_DISPATCH] {
    if (!t_is_set("onreply_route")) { t_on_reply("NAT_REPLY"); }
    if (!t_is_set("failure_route")) { t_on_failure("N5_rtp_failure"); }
    $var(n5_leg) = "MO";
    $var(rtpe_leg_flags) = "call-id=" + $ci + "-pcscf-mo";
    if (!isflagset(FLT_MOBILE_ORIG)) {
        $var(n5_leg) = "MT";
        $var(n5_rtp_mt_ue) = "";
        if (is_request() && !has_totag()) {
            $var(n5_rtp_mt_ue) = $dd;
        } else if (route(N5_MEDIA_KEY)) {
            $var(n5_rtp_mt_ue) = $sht(n5_media_state=>$var(n5_key)::ue);
        }
        if (!is_ipv4("$var(n5_rtp_mt_ue)")) { $var(n5_rtp_mt_ue) = $avp(n5_rtp_mt_ue); }
        if (!is_ipv4("$var(n5_rtp_mt_ue)")) {
            xerr("RTP MT-context-unavailable call=$ci method=$rm; refusing shared terminating relay ID\n");
            return;
        }
        $avp(n5_rtp_mt_ue) = $var(n5_rtp_mt_ue);
        $var(rtpe_leg_flags) = "call-id=" + $ci + "-pcscf-mt-" + $var(n5_rtp_mt_ue);
    }
    # Initial transport conversion flags are chosen by ENC_*/DEC_* in rtp.cfg.
    # In-dialog NG operations retain the relay's previously negotiated settings.
    $var(n5_rtp_offer_flags) = "";
    $var(n5_rtp_answer_flags) = "";
    if ($avp(rtpproxy_offer_flags) != $null) { $var(n5_rtp_offer_flags) = $avp(rtpproxy_offer_flags); }
    if ($avp(rtpproxy_answer_flags) != $null) { $var(n5_rtp_answer_flags) = $avp(rtpproxy_answer_flags); }
    # The N5 builder supports the IMS IPv4 RTP profile, without ICE. Forcing
    # ICE onto the terminating offer would make its relay SDP unsupported by
    # the same builder. Preserve codec/transport flags and remove ICE only.
    $var(n5_rtp_offer_flags) = $(var(n5_rtp_offer_flags){re.subst,/ICE=force/ICE=remove/g});
    $var(n5_rtp_answer_flags) = $(var(n5_rtp_answer_flags){re.subst,/ICE=force/ICE=remove/g});
    if (t_is_failure_route()) {
        if ($avp(n5_initial) == 1) {
            $var(n5_rtpe_op) = "manage";
            $var(n5_rtpe_flags) = $var(rtpe_leg_flags);
            route(N5_RTP_RUN);
        } else if (route(N5_MEDIA_KEY)) { route(N5_RTP_RESTORE); }
        return;
    }
    if (is_method("BYE")) {
        # TS 24.229 Annex A refers to RFC 3261 15: delete on the request.
        # Repeating NG deletion on its response would touch an already-ended relay.
        if (is_request()) {
            $var(n5_rtpe_op) = "manage";
            $var(n5_rtpe_flags) = $var(rtpe_leg_flags);
            route(N5_RTP_RUN);
        }
        return;
    }
    # TS 24.229 Annex A refers to RFC 3261 9: CANCEL awaits the INVITE's
    # final result; a racing accepted dialog must retain its media relay.
    if (is_method("CANCEL") || !sdp_content()) { return; }
#!ifndef FORCE_RTPRELAY
    if (!isflagset(FLT_NAT) || !check_route_param("rm=")) { return; }
#!endif
    setflag(FLT_RTP);
    if (is_request() && !has_totag() && is_method("INVITE")) {
        if (isflagset(FLT_MOBILE_ORIG)) { set_dlg_profile("caller", "$fU"); }
        else { set_dlg_profile("callee", "$tU"); }
    }
    route(N5_RTP_DELAYED);
    if ($var(n5_rtp_handled) == 1) { return; }
    if (is_request() && is_method("INVITE|UPDATE")) {
        $var(n5_rtpe_op) = "offer";
        $var(n5_rtpe_flags) = $var(n5_rtp_offer_flags) + " " + $var(rtpe_leg_flags);
        route(N5_RTP_RUN);
    } else if (is_reply() && is_method("INVITE|UPDATE") && t_check_status("^[12][0-9][0-9]$")) {
        $var(n5_rtpe_op) = "answer";
        $var(n5_rtpe_flags) = $var(n5_rtp_answer_flags) + " " + $var(rtpe_leg_flags);
        route(N5_RTP_RUN);
    }
}

failure_route[N5_rtp_failure] {
    if ($avp(n5_initial) == 1) { route(N5_INITIAL_FAILED); }
    else { route(NATMANAGE); }
}
#!endif
