#!ifdef WITH_N5
# TS 24.229 4.1/Annex A refers to RFC 3261 14.1: rejection leaves the
# previous session parameters in force. TS 24.610 4.5.2.1 refers to RFC 3264.
# Cache the actual SDP inputs to each relay pass, not its rewritten outputs.
# RTPengine mr26 has no documented NG rollback command. Reapply the last
# completed offer/answer explicitly without rewriting the SIP failure response.
route[N5_RTP_RUN] {
    $var(n5_rtpe_input) = $sdp(body);
    $var(n5_rtpe_output) = "";
    $var(n5_rtpe_success) = 0;
    $var(n5_rtpe_kind) = $var(n5_rtpe_op);
    if ($var(n5_rtpe_op) == "manage") {
        if (is_request() && is_method("INVITE|UPDATE|PRACK")) { $var(n5_rtpe_kind) = "offer"; }
        if (is_reply() && t_check_status("^[12][0-9][0-9]$")) { $var(n5_rtpe_kind) = "answer"; }
        if (is_method("BYE|CANCEL") || t_is_failure_route()) { $var(n5_rtpe_kind) = "delete"; }
    }
    # TS 24.229 4.1/Annex A refers to RFC 3261 13.2.2.4/16.7 for
    # multiple 2xx, ACK and BYE. Relay selection/locking is local policy.
    $var(n5_rtp_locked) = 0;
    if ((is_reply() || has_totag())
            && (sdp_content() || $var(n5_rtpe_kind) == "delete")) {
        $var(n5_leg) = "MO";
        if (!isflagset(FLT_MOBILE_ORIG)) { $var(n5_leg) = "MT"; }
        if (route(N5_MEDIA_KEY)) {
            sht_lock("n5_media_dialogs=>$var(n5_key)");
            $var(n5_rtp_locked) = 1;
            # A null $var becomes integer zero. Initialize strings and copy
            # only existing htable values, formatted explicitly as text.
            $var(n5_rtp_winner) = "";
            $var(n5_rtp_context_state) = "";
            if ($sht(n5_media_state=>$var(n5_key)::winner) != $null) {
                $var(n5_rtp_winner) = $_s($sht(n5_media_state=>$var(n5_key)::winner));
            }
            if ($sht(n5_media_dialogs=>$var(n5_key)) != $null) {
                $var(n5_rtp_context_state) = $_s($sht(n5_media_dialogs=>$var(n5_key)));
            }
            $var(n5_rtp_unselected) = 0;
            if (!strempty($var(n5_rtp_winner)) && !strempty($var(n5_to_tag))
                    && $var(n5_rtp_winner) != $var(n5_to_tag)) {
                $var(n5_rtp_unselected) = 1;
            }
            if ($var(n5_rtpe_kind) == "delete") {
                # RTPengine mr26 can alias early To-tags in its shared MO
                # participant. Deleting a losing tag can delete the winner too.
                # Keep this MO relay until the selected dialog ends; the losing
                # UE's separate MT relay is still deleted on its own pass.
                if ($var(n5_leg) == "MO" && $var(n5_rtp_unselected) == 1) {
                    xnotice("RTP losing-MO-release-skipped context=$var(n5_key) selected=$var(n5_rtp_winner) dialog=$var(n5_to_tag); shared winner relay retained, MT cleanup continues\n");
                    sht_unlock("n5_media_dialogs=>$var(n5_key)");
                    $var(n5_rtpe_success) = 1;
                    return;
                }
            } else if (($var(n5_rtp_context_state) =~ "^closed(:|$)")
                    || $var(n5_rtp_unselected) == 1) {
                xnotice("RTP unselected-dialog-ignored context=$var(n5_key) selected=$var(n5_rtp_winner) dialog=$var(n5_to_tag) method=$rm status=$rs; SIP response still relayed\n");
                sht_unlock("n5_media_dialogs=>$var(n5_key)");
                $var(n5_rtpe_success) = 1;
                return;
            }
        }
    }
    if ($var(n5_rtpe_kind) == "delete" && !strempty($ft) && !strempty($tt)) {
        # RTPengine mr26 NG delete: honour both tags and remove this branch
        # immediately; delayed wildcard cleanup can feed a released fork.
        $var(n5_rtpe_flags) = $var(n5_rtpe_flags) + " to-tag delete-delay=0";
    }
    if ($var(n5_rtpe_op) == "manage") {
        if (rtpengine_manage($var(n5_rtpe_flags))) { $var(n5_rtpe_success) = 1; }
    } else if ($var(n5_rtpe_op) == "offer") {
        if (rtpengine_offer($var(n5_rtpe_flags))) { $var(n5_rtpe_success) = 1; }
    } else if ($var(n5_rtpe_op) == "answer") {
        if (rtpengine_answer($var(n5_rtpe_flags))) { $var(n5_rtpe_success) = 1; }
    }
    if ($var(n5_rtp_locked) == 1) { sht_unlock("n5_media_dialogs=>$var(n5_key)"); }
    if ($var(n5_rtpe_success) == 0) {
        xlog("L_ERR", "RTP operation-failed op=$var(n5_rtpe_op) call=$ci method=$rm cseq=$cs\n");
        return;
    }
    if ($var(n5_rtpe_input) =~ "^v=0") { route(N5_RTP_REMEMBER); }
    if ($var(n5_rtpe_output) =~ "^v=0") {
        # Kamailio textopsx/FAQ: rebuilding after record_route() can evaluate
        # unresolved send-socket substitutions. Keep the wire replacement queued;
        # N5 consumes the explicit transmit SDP, not a reparsed SIP buffer.
        $var(n5_tx_sdp) = $var(n5_rtpe_output);
        set_body("$var(n5_rtpe_output)", "application/sdp");
    }
}

route[N5_RTP_REMEMBER] {
    if (isflagset(FLT_MOBILE_ORIG)) { $var(n5_leg) = "MO"; }
    else { $var(n5_leg) = "MT"; }
    if ($var(n5_rtpe_kind) == "offer" && is_request()) {
        $avp(n5_rtp_offer_sdp) = $var(n5_rtpe_input);
        $avp(n5_rtp_offer_flags) = $var(n5_rtpe_flags);
        return;
    }
    if (!route(N5_MEDIA_KEY)) { return; }
    if ($var(n5_rtpe_kind) == "offer" && is_reply()) {
        sht_lock("n5_media_dialogs=>$var(n5_key)");
        $sht(n5_media_state=>$var(n5_branch)::rtp-late-offer) = $var(n5_rtpe_input);
        $sht(n5_media_state=>$var(n5_branch)::rtp-late-flags) = $var(n5_rtpe_flags);
        sht_unlock("n5_media_dialogs=>$var(n5_key)");
        return;
    }
    if ($var(n5_rtpe_kind) != "answer") { return; }
    $var(n5_rtp_offer_sdp) = $avp(n5_rtp_offer_sdp);
    $var(n5_rtp_offer_flags) = $avp(n5_rtp_offer_flags);
    $var(n5_rtp_ft) = $ft;
    $var(n5_rtp_tt) = $tt;
    if (is_request() && is_method("ACK|PRACK")) {
        $var(n5_rtp_offer_sdp) = $sht(n5_media_state=>$var(n5_branch)::rtp-late-offer);
        $var(n5_rtp_offer_flags) = $sht(n5_media_state=>$var(n5_branch)::rtp-late-flags);
        $var(n5_rtp_ft) = $tt;
        $var(n5_rtp_tt) = $ft;
    }
    if (!($var(n5_rtp_offer_sdp) =~ "^v=0")) { return; }
    sht_lock("n5_media_dialogs=>$var(n5_key)");
    $sht(n5_media_state=>$var(n5_branch)::rtp-good-offer) = $var(n5_rtp_offer_sdp);
    $sht(n5_media_state=>$var(n5_branch)::rtp-good-answer) = $var(n5_rtpe_input);
    $sht(n5_media_state=>$var(n5_branch)::rtp-good-offer-flags) = $var(n5_rtp_offer_flags);
    $sht(n5_media_state=>$var(n5_branch)::rtp-good-answer-flags) = $var(n5_rtpe_flags);
    $sht(n5_media_state=>$var(n5_branch)::rtp-good-ft) = $var(n5_rtp_ft);
    $sht(n5_media_state=>$var(n5_branch)::rtp-good-tt) = $var(n5_rtp_tt);
    sht_unlock("n5_media_dialogs=>$var(n5_key)");
    xnotice("RTP negotiation-committed context=$var(n5_key) dialog=$var(n5_to_tag) method=$rm cseq=$cs\n");
}

route[N5_RTP_RESTORE] {
    if ($avp(n5_initial) == 1 || !is_method("INVITE|UPDATE|PRACK")) { return; }
    sht_lock("n5_media_dialogs=>$var(n5_key)");
    $var(n5_rtp_restore_key) = $var(n5_branch) + "::rtp-restored|" + $rm + "|" + $cs + "|" + $var(n5_upstream);
    if ($sht(n5_media_state=>$var(n5_rtp_restore_key)) != $null) {
        sht_unlock("n5_media_dialogs=>$var(n5_key)");
        return;
    }
    $var(n5_rtp_old_offer) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-offer);
    $var(n5_rtp_old_answer) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-answer);
    if (!($var(n5_rtp_old_offer) =~ "^v=0") || !($var(n5_rtp_old_answer) =~ "^v=0")) {
        xlog("L_ERR", "RTP restore-unavailable context=$var(n5_key) dialog=$var(n5_to_tag) method=$rm cseq=$cs; no completed SDP pair\n");
        sht_unlock("n5_media_dialogs=>$var(n5_key)");
        return;
    }
    $var(n5_rtp_tags) = " from-tag=" + $sht(n5_media_state=>$var(n5_branch)::rtp-good-ft)
        + " to-tag=" + $sht(n5_media_state=>$var(n5_branch)::rtp-good-tt) + " trust-address";
    $var(n5_rtp_restore_flags) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-offer-flags) + $var(n5_rtp_tags);
    $var(n5_rtpe_input) = $var(n5_rtp_old_offer);
    $var(n5_rtpe_output) = "";
    if (!rtpengine_offer($var(n5_rtp_restore_flags))) {
        xlog("L_ERR", "RTP restore-offer-failed context=$var(n5_key) dialog=$var(n5_to_tag)\n");
        sht_unlock("n5_media_dialogs=>$var(n5_key)");
        return;
    }
    $var(n5_rtp_restore_flags) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-answer-flags) + $var(n5_rtp_tags);
    $var(n5_rtpe_input) = $var(n5_rtp_old_answer);
    if (!rtpengine_answer($var(n5_rtp_restore_flags))) {
        xlog("L_ERR", "RTP restore-answer-failed context=$var(n5_key) dialog=$var(n5_to_tag)\n");
        sht_unlock("n5_media_dialogs=>$var(n5_key)");
        return;
    }
    # write_sdp_pv keeps the replay output out of the 3xx-6xx SIP response.
    $sht(n5_media_state=>$var(n5_rtp_restore_key)) = 1;
    sht_unlock("n5_media_dialogs=>$var(n5_key)");
    xnotice("RTP previous-negotiation-restored context=$var(n5_key) dialog=$var(n5_to_tag) method=$rm cseq=$cs status=$rs; N5 policy unchanged\n");
}

# Caller holds n5_media_dialogs. An answer from another fork can have updated
# the shared MO relay before the first final response selects its winner.
# Reapply that winner's cached pair; late alternatives are guarded above.
route[N5_RTP_SELECT_LOCKED] {
    if ($var(n5_leg) != "MO") { return; }
    if ($sht(n5_media_state=>$var(n5_key)::forked) != 1) { return; }
    $var(n5_select_offer) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-offer);
    $var(n5_select_answer) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-answer);
    if (!($var(n5_select_offer) =~ "^v=0") || !($var(n5_select_answer) =~ "^v=0")) {
        xnotice("RTP selected-dialog-answer-pending context=$var(n5_key) dialog=$var(n5_to_tag); offerless setup completes in ACK/PRACK\n");
        return;
    }
    $var(n5_select_tags) = " from-tag=" + $sht(n5_media_state=>$var(n5_branch)::rtp-good-ft)
        + " to-tag=" + $sht(n5_media_state=>$var(n5_branch)::rtp-good-tt) + " trust-address";
    $var(n5_select_flags) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-offer-flags) + $var(n5_select_tags);
    $var(n5_rtpe_input) = $var(n5_select_offer);
    $var(n5_rtpe_output) = "";
    if (!rtpengine_offer($var(n5_select_flags))) {
        xerr("RTP selected-dialog-offer-failed context=$var(n5_key) dialog=$var(n5_to_tag)\n"); return;
    }
    $var(n5_select_flags) = $sht(n5_media_state=>$var(n5_branch)::rtp-good-answer-flags) + $var(n5_select_tags);
    $var(n5_rtpe_input) = $var(n5_select_answer);
    if (!rtpengine_answer($var(n5_select_flags))) {
        xerr("RTP selected-dialog-answer-failed context=$var(n5_key) dialog=$var(n5_to_tag)\n"); return;
    }
    # write_sdp_pv keeps the replay out of SIP. Do not apply/reparse its output.
    xnotice("RTP selected-dialog-restored context=$var(n5_key) dialog=$var(n5_to_tag)\n");
}
#!endif
