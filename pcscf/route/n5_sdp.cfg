            jansson_append("str", "", "$var(n5_flow)", "$var(n5_flows)");
            $var(n5_flow) = "permit in 17 from " + $var(local_video_ip)
                + " to " + $var(remote_video_ip) + " " + $var(remote_video_rtcp);
            jansson_append("str", "", "$var(n5_flow)", "$var(n5_flows)");
#!endif
            jansson_set("array", "fDescs", "$var(n5_flows)", "$var(n5_sub)");
        }
#!ifdef WITH_N5_SPLIT_RTP_RTCP
        jansson_set("obj", "medSubComps.2", "$var(n5_sub)", "$var(n5_component)");
#!else
        $var(n5_subpath) = "medSubComps." + $var(n5_index);
        jansson_set("obj", "$var(n5_subpath)", "$var(n5_sub)", "$var(n5_component)");
#!endif
        $var(n5_bw) = $_s($var(local_video_bw) Kbps);
        jansson_set("str", "marBwDl", "$var(n5_bw)", "$var(n5_component)");
        jansson_set("str", "marBwUl", "$var(n5_bw)", "$var(n5_component)");
        jansson_set("obj", "$var(n5_index)", "$var(n5_component)", "$var(n5_components)");
    }
    return(1);
}
#!endif
